<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="game.css">
  <title>box clicker :)</title>
</head>

<body>

<div class="container">

  <!-- 💥 MAIN GAME -->
  <div class="game">
    <h2>Box Clicker</h2>

    <p>Time Left: <span id="timer">30</span>s</p>

    <div id="gameArea">
      <div id="box"></div>
    </div>

    <p>Score: <span id="score">0</span></p>
    <p>High score: <span id="high_score">0</span></p>

    <p>The highest score in the game, was 366! Daxton holds this record!!</p>

  </div>

  <!-- 💥 SIDE PANEL -->
  <div class="sidepanel">

    <input id="debugInput" type="password" placeholder="Enter debug password">
    <button onclick="enterDebug()">Submit</button>
    <button onclick="resetHighScore()">Reset High Score</button>
    <button id="resetbuttom" onclick="reset()" style="display:none;">Reset</button>

    <br><br>

    <div id="debugPanel" style="display:none;">

      <button onclick="toggleDebug()">Debug: OFF</button>

      <br><br>

      <button onclick="setMode('gold')">Force Gold</button>
      <button onclick="setMode('green')">Force Green</button>
      <button onclick="setMode('none')">Normal Mode</button>

      <input id="setHighInput" placeholder="Set high score">
      <button onclick="setHighScore(document.getElementById('setHighInput').value)">
        Set High Score
      </button>

    </div>

    <br><br>

    <a href="index.html">⬅ Return to home page</a>

  </div>

</div>

<div id="subtitle"></div>

<script src="script.js"></script>

</body>
</html>
